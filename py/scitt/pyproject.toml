[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlair-scitt"
version = "0.0.1"
description = "AgentLair SCITT (Supply Chain Integrity, Transparency, and Trust) primitive — reserved namespace stub. Append-only transparency log for agent-signed statements. RFC 9711-aligned."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "AgentLair (piiiico)", email = "ops@agentlair.dev" }
]
keywords = ["agentlair","agent-trust","scitt","rfc9711","transparency-log","cose","signed-statement"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://agentlair.dev/specs/scitt"
Repository = "https://github.com/piiiico/agentlair-primitives"
"Bug Tracker" = "https://github.com/piiiico/agentlair-primitives/issues"

[tool.setuptools.packages.find]
include = ["agentlair_scitt*"]
exclude = ["tests*"]
