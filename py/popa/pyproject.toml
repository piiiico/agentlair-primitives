[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlair-popa"
version = "0.0.1"
description = "AgentLair PoPA (Proof of Persistent Activity) primitive — reserved namespace stub. Daily attestation streaks anchored to SCITT. Operational presence as a credibility signal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "AgentLair (piiiico)", email = "ops@agentlair.dev" }
]
keywords = ["agentlair","agent-trust","popa","behavioral-attestation","proof-of-personhood-alternative","scitt"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://agentlair.dev/specs/popa"
Repository = "https://github.com/piiiico/agentlair-primitives"
"Bug Tracker" = "https://github.com/piiiico/agentlair-primitives/issues"

[tool.setuptools.packages.find]
include = ["agentlair_popa*"]
exclude = ["tests*"]
