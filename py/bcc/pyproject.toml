[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlair-bcc"
version = "0.0.1"
description = "AgentLair BCC (Bonded Credibility Credential) primitive — reserved namespace stub. Umbrella W3C VC 2.0 schema covering the three irreducible stake mediums."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "AgentLair (piiiico)", email = "ops@agentlair.dev" }
]
keywords = ["agentlair","agent-trust","bcc","bonded-credibility","verifiable-credentials","w3c-vc","behavioral-attestation"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://agentlair.dev/specs/bcc"
Repository = "https://github.com/piiiico/agentlair-primitives"
"Bug Tracker" = "https://github.com/piiiico/agentlair-primitives/issues"

[tool.setuptools.packages.find]
include = ["agentlair_bcc*"]
exclude = ["tests*"]
